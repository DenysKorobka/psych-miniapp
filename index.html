<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <title>Психолог Олена Коваленко</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --blue:#1A56DB;--blue2:#1447CC;--violet:#6D28D9;
      --blue-soft:#EBF0FF;--blue-mid:#DBEAFE;
      --bg:#F2F5FB;--white:#FFFFFF;
      --text:#0A0F1E;--text2:#4B5675;--text3:#9BA3BB;
      --green:#059669;--red:#DC2626;--yellow:#D97706;
      --grad:linear-gradient(135deg,#1A56DB,#6D28D9);
      --grad-soft:linear-gradient(135deg,#EBF0FF,#EDE9FE);
      --shadow:0 2px 16px rgba(10,15,30,.07);
      --shadow-md:0 4px 24px rgba(10,15,30,.10);
      --shadow-blue:0 6px 28px rgba(26,86,219,.28);
      --r:20px;--r-sm:14px;--r-xs:9px;
    }
    html,body,#root{height:100%;font-family:'Manrope',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
    .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
    .screen{flex:1;overflow-y:auto;padding:0 12px 96px;-webkit-overflow-scrolling:touch}
    .screen-inner{padding-top:14px}

    /* ── BOTTOM NAV ── */
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--white);border-top:1px solid rgba(26,86,219,.08);display:flex;padding:8px 4px max(10px,env(safe-area-inset-bottom));z-index:100;box-shadow:0 -4px 32px rgba(26,86,219,.10)}
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;border:none;background:none;cursor:pointer;font-family:'Manrope',sans-serif;transition:transform .1s}
    .nav-item:active{transform:scale(.85)}
    .nav-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.2px}
    .nav-item.active .nav-label{color:var(--blue)}
    .nav-dot{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;transition:all .2s}
    .nav-item.active .nav-dot{background:var(--blue-soft)}

    /* ── CARDS ── */
    .card{background:var(--white);border-radius:var(--r);padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
    .card-grad{background:var(--grad);border-radius:var(--r);padding:20px;margin-bottom:12px}

    /* ── HERO ── */
    .hero{background:var(--grad);border-radius:var(--r);margin-bottom:12px;position:relative;overflow:hidden}
    .hero-inner{padding:22px 18px 20px;position:relative;z-index:1}
    .hero-orb1{position:absolute;width:240px;height:240px;background:rgba(255,255,255,.06);border-radius:50%;top:-80px;right:-70px;pointer-events:none}
    .hero-orb2{position:absolute;width:160px;height:160px;background:rgba(255,255,255,.04);border-radius:50%;bottom:-60px;left:-40px;pointer-events:none}

    /* ── BUTTONS ── */
    .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 20px;border:none;border-radius:var(--r-sm);font-family:'Manrope',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:transform .12s,opacity .12s;text-decoration:none;letter-spacing:.1px}
    .btn:active{transform:scale(.97)}
    .btn-primary{background:var(--grad);color:#fff;box-shadow:var(--shadow-blue)}
    .btn-secondary{background:var(--blue-soft);color:var(--blue)}
    .btn-ghost{background:transparent;color:var(--text2);font-weight:600}
    .btn-white{background:var(--white);color:var(--blue);box-shadow:var(--shadow)}
    .btn:disabled{opacity:.4;pointer-events:none}

    /* ── STATS ── */
    .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
    .stat-card{background:var(--white);border-radius:var(--r-sm);padding:14px 10px;text-align:center;box-shadow:var(--shadow)}
    .stat-val{font-size:22px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .stat-lbl{font-size:11px;color:var(--text2);font-weight:600;margin-top:2px}

    /* ── CHIPS ── */
    .chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.18);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;color:rgba(255,255,255,.95);backdrop-filter:blur(4px)}
    .chip-blue{background:var(--blue-soft);color:var(--blue);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
    .chip-green{background:#D1FAE5;color:var(--green);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}

    /* ── ICON BOX ── */
    .icon-box{border-radius:13px;background:var(--grad);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .icon-box-soft{border-radius:13px;background:var(--grad-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}

    /* ── SECTION HEADER ── */
    .sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .sec-title{font-size:17px;font-weight:800;color:var(--text)}
    .sec-link{background:none;border:none;cursor:pointer;font-family:'Manrope';font-size:13px;font-weight:700;color:var(--blue);padding:0}

    /* ── NUMBERED LIST ITEMS (reference style) ── */
    .num-list{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
    .num-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid #F0F4FF;cursor:pointer;transition:background .12s}
    .num-item:last-child{border-bottom:none}
    .num-item:active{background:var(--blue-soft)}
    .num-badge{width:32px;height:32px;border-radius:10px;background:var(--blue-soft);color:var(--blue);font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .num-badge-grad{background:var(--grad);color:#fff}
    .num-item-title{font-size:14px;font-weight:700;color:var(--text);flex:1}
    .num-item-sub{font-size:12px;color:var(--text2);margin-top:1px}

    /* ── ARROW LINK ITEMS (reference style) ── */
    .arrow-item{display:flex;align-items:center;padding:16px;border-bottom:1px solid #F0F4FF;cursor:pointer;transition:background .12s;background:var(--white)}
    .arrow-item:first-child{border-radius:var(--r) var(--r) 0 0}
    .arrow-item:last-child{border-bottom:none;border-radius:0 0 var(--r) var(--r)}
    .arrow-item:only-child{border-radius:var(--r)}
    .arrow-item:active{background:var(--blue-soft)}
    .arrow-body{flex:1;min-width:0}
    .arrow-title{font-size:15px;font-weight:700;color:var(--text)}
    .arrow-sub{font-size:12px;color:var(--text2);margin-top:2px}
    .arrow-icon{width:32px;height:32px;background:var(--blue-soft);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

    /* ── BANNER CARD (reference image card) ── */
    .banner-card{border-radius:var(--r);overflow:hidden;margin-bottom:12px;cursor:pointer;box-shadow:var(--shadow-md);position:relative}
    .banner-card-inner{background:var(--grad);padding:22px 18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
    .banner-card-orb{position:absolute;width:180px;height:180px;background:rgba(255,255,255,.08);border-radius:50%;right:-40px;bottom:-60px;pointer-events:none}
    .bc-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.2);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;color:#fff;width:fit-content}
    .bc-title{font-size:20px;font-weight:800;color:#fff;line-height:1.2;position:relative;z-index:1}
    .bc-sub{font-size:13px;color:rgba(255,255,255,.8);position:relative;z-index:1}
    .bc-progress{height:6px;background:rgba(255,255,255,.25);border-radius:10px;overflow:hidden;position:relative;z-index:1}
    .bc-progress-fill{height:100%;background:#fff;border-radius:10px}
    .bc-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:10px 16px;font-family:'Manrope';font-size:13px;font-weight:700;color:#fff;cursor:pointer;width:fit-content;position:relative;z-index:1;backdrop-filter:blur(4px)}

    /* ── CHECKIN ── */
    .checkin-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
    .checkin-btn{background:var(--bg);border:2px solid transparent;border-radius:var(--r-sm);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:all .15s}
    .checkin-btn:active,.checkin-btn.sel{border-color:var(--blue);background:var(--blue-soft);transform:scale(.96)}
    .c-emoji{font-size:26px}
    .c-label{font-size:11px;font-weight:700;color:var(--text2)}

    /* ── PROGRESS ── */
    .progress-bar{height:5px;background:#E2E8F0;border-radius:10px;margin-bottom:20px;overflow:hidden}
    .progress-fill{height:100%;background:var(--grad);border-radius:10px;transition:width .4s ease}
    .test-option{width:100%;padding:14px 16px;background:var(--white);border:2px solid #E2E8F0;border-radius:var(--r-sm);font-family:'Manrope';font-size:14px;font-weight:600;color:var(--text);text-align:left;cursor:pointer;margin-bottom:8px;transition:all .12s;display:flex;align-items:center;gap:12px}
    .test-option:active,.test-option.selected{border-color:var(--blue);background:var(--blue-soft)}
    .opt-circle{width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}

    /* ── BOOKING ── */
    .step-dots{display:flex;gap:6px;justify-content:center;margin-bottom:24px}
    .step-dot{width:6px;height:6px;border-radius:50%;background:#E2E8F0;transition:all .2s}
    .step-dot.active{background:var(--blue);width:24px;border-radius:3px}
    .step-dot.done{background:var(--green)}

    input,textarea{width:100%;padding:13px 15px;border:2px solid #E2E8F0;border-radius:var(--r-sm);font-family:'Manrope';font-size:15px;font-weight:600;background:var(--white);color:var(--text);outline:none;transition:border .15s;-webkit-appearance:none}
    input:focus,textarea:focus{border-color:var(--blue)}
    input::placeholder,textarea::placeholder{color:var(--text3);font-weight:500}
    textarea{resize:none}
    label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px;margin-top:14px;text-transform:uppercase;letter-spacing:.6px}

    /* ── CONFIRM ── */
    .confirm-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #F1F5F9}
    .confirm-label{font-size:11px;color:var(--text2);font-weight:700;width:70px;flex-shrink:0;padding-top:2px;text-transform:uppercase;letter-spacing:.4px}
    .confirm-value{font-size:14px;font-weight:600;color:var(--text);line-height:1.4}

    /* ── CHAT ── */
    .chat-input-row{display:flex;gap:8px;padding-top:10px;border-top:1px solid #EEF2FF}
    .chat-input-row input{flex:1}
    .send-btn{width:48px;height:48px;flex-shrink:0;background:var(--grad);color:#fff;border:none;border-radius:var(--r-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-blue);transition:opacity .12s}
    .send-btn:active{opacity:.7}
    .send-btn:disabled{opacity:.35}
    .chat-messages{overflow-y:auto;flex:1;padding:4px 0 8px;display:flex;flex-direction:column;gap:6px}
    .bubble{max-width:82%;border-radius:18px;padding:11px 14px;font-size:14px;font-weight:500;line-height:1.65}
    .bubble-bot{background:var(--white);border-bottom-left-radius:4px;color:var(--text);box-shadow:var(--shadow)}
    .bubble-user{background:var(--grad);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
    .chat-session{background:var(--white);border-radius:var(--r-sm);padding:14px 16px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow);border:2px solid transparent;transition:all .12s}
    .chat-session:active,.chat-session.active{border-color:var(--blue)}
    .cs-title{font-size:14px;font-weight:700;color:var(--text)}
    .cs-preview{font-size:12px;color:var(--text2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cs-date{font-size:11px;color:var(--text3);margin-top:3px}

    /* ── TABS ── */
    .tabs{display:flex;background:#EEF2FF;border-radius:var(--r-sm);padding:3px;margin-bottom:14px}
    .tab-btn{flex:1;padding:9px 0;border:none;border-radius:10px;font-family:'Manrope';font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;background:transparent;color:var(--text2)}
    .tab-btn.active{background:var(--white);color:var(--blue);box-shadow:0 2px 8px rgba(10,15,30,.08)}

    /* ── BACK BTN ── */
    .back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;color:var(--blue);font-family:'Manrope';font-size:14px;font-weight:700;padding:0 0 14px}

    /* ── SERVICE CARD ── */
    .svc-card{background:var(--white);border-radius:var(--r);padding:18px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow);transition:all .15s;border:2px solid transparent}
    .svc-card:active{border-color:var(--blue)}
    .svc-price{font-size:22px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .tag{display:inline-flex;align-items:center;background:var(--blue-soft);color:var(--blue);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700}

    /* ── DOTS ANIM ── */
    @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
    .dot{width:7px;height:7px;background:var(--text3);border-radius:50%;display:inline-block;margin:0 2px;animation:bounce 1.2s infinite}
    .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}

    /* ── UTILS ── */
    .mt-8{margin-top:8px}.mt-12{margin-top:12px}.mb-10{margin-bottom:10px}
    .pre{white-space:pre-line;line-height:1.75;font-size:14px;color:var(--text2)}
    .divider{height:1px;background:#F1F5F9;margin:12px 0}
    .grad-text{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .info-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #F8F9FF}
    .info-row:last-child{border-bottom:none}
    .section-title{font-size:18px;font-weight:800;color:var(--text);margin-bottom:14px}

    /* ── TESTIMONIAL ── */
    .quote-card{background:var(--white);border-radius:var(--r);padding:20px;margin-bottom:10px;box-shadow:var(--shadow);position:relative}
    .quote-mark{font-size:48px;line-height:1;color:var(--blue-soft);font-weight:800;position:absolute;top:10px;left:16px;opacity:.6}

    /* ── MATERIAL CARD ── */
    .mat-card{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
    .mat-header{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid #F0F4FF}
    .mat-body{padding:14px 18px}
  </style>
</head>

// ── Notify via proxy ───────────────────────────────────────────────────
async function sendNotify(text) {
  try {
    const res = await fetch(`${PROXY_URL}/notify`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({chat_id: CHAT_ID, text})
    });
    return res.ok;
  } catch(e) { console.error('notify error', e); return false; }
}

const SCHEDULE = {1:["10:00","11:00","13:00","15:00","17:00","19:00"],2:["10:00","12:00","14:00","16:00","18:00"],3:["10:00","11:00","13:00","15:00","17:00","19:00"],4:["10:00","12:00","14:00","16:00"],5:["10:00","11:00","13:00","15:00"]};
const BOOKED = ["2026-03-12 10:00","2026-03-13 14:00","2026-03-14 11:00"];

function getResult(score, total) {
  const pct = score / (total * 3) * 100;
  if(pct < 25) return {level:"Стабільний стан", color:"var(--green)", text:"Ваш стан загалом добрий. Профілактична робота з психологом допоможе глибше пізнати себе і розкрити потенціал."};
  if(pct < 50) return {level:"Є зони для уваги", color:"var(--yellow)", text:"Є кілька зон що потребують уваги. Хороший момент для початку роботи — поки ситуація не поглибилась."};
  if(pct < 75) return {level:"Потрібна підтримка", color:"#F97316", text:"Значне навантаження. Підтримка психолога може суттєво змінити якість вашого повсякденного життя."};
  return {level:"Рекомендую звернутись", color:"var(--red)", text:"Зараз вам справді важко. Будь ласка не відкладайте — зверніться до фахівця."};
}

function getDailyTest() {
  const dow = new Date().getDay();
  const idx = dow === 0 ? 6 : dow - 1;
  return DAILY_TESTS[Math.min(idx, DAILY_TESTS.length - 1)];
}

// ── CALENDAR ──────────────────────────────────────────────────────────
function CalendarPicker({onSelect}) {
  const today=new Date();
  const [month,setMonth]=useState(today.getMonth());
  const [year,setYear]=useState(today.getFullYear());
  const [selDate,setSelDate]=useState(null);
  const [selTime,setSelTime]=useState(null);
  const MONTHS=["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
  const DAYS=["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];
  const daysInMonth=new Date(year,month+1,0).getDate();
  let firstDay=new Date(year,month,1).getDay();firstDay=firstDay===0?6:firstDay-1;
  const fmt=(d)=>`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const isPast=(d)=>new Date(year,month,d)<new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const hasSlots=(d)=>{const dow=new Date(year,month,d).getDay()||7;return(SCHEDULE[dow]||[]).some(t=>!BOOKED.includes(`${fmt(d)} ${t}`));};
  const getSlots=(d)=>{const dow=new Date(year,month,d).getDay()||7;return(SCHEDULE[dow]||[]).filter(t=>!BOOKED.includes(`${fmt(d)} ${t}`));};
  const cells=[];for(let i=0;i<firstDay;i++)cells.push(null);for(let d=1;d<=daysInMonth;d++)cells.push(d);
  const prevM=()=>{month===0?(setMonth(11),setYear(y=>y-1)):setMonth(m=>m-1);setSelDate(null);setSelTime(null);};
  const nextM=()=>{month===11?(setMonth(0),setYear(y=>y+1)):setMonth(m=>m+1);setSelDate(null);setSelTime(null);};
  return(
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
        <button onClick={prevM} style={{width:36,height:36,background:"var(--bg)",border:"none",borderRadius:10,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="back" size={16} color="var(--text2)"/></button>
        <span style={{fontWeight:800,fontSize:15}}>{MONTHS[month]} {year}</span>
        <button onClick={nextM} style={{width:36,height:36,background:"var(--bg)",border:"none",borderRadius:10,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",transform:"rotate(180deg)"}}><Icon name="back" size={16} color="var(--text2)"/></button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:8}}>
        {DAYS.map(d=><div key={d} style={{textAlign:"center",fontSize:11,fontWeight:700,color:"var(--text3)",padding:"4px 0"}}>{d}</div>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
        {cells.map((d,i)=>{
          if(!d)return<div key={i}/>;
          const past=isPast(d),slots=hasSlots(d),selected=selDate===d;
          return(
            <button key={i} onClick={()=>{if(!past&&slots){setSelDate(d);setSelTime(null);}}}
              style={{aspectRatio:"1",border:"2px solid",borderColor:selected?"var(--blue)":"transparent",borderRadius:10,fontSize:13,fontWeight:700,cursor:past||!slots?"default":"pointer",background:selected?"var(--blue)":past?"transparent":slots?"var(--blue-soft)":"transparent",color:selected?"#fff":past?"var(--text3)":slots?"var(--blue)":"var(--text3)",transition:"all .12s",fontFamily:"Manrope"}}>
              {d}
            </button>
          );
        })}
      </div>
      {selDate&&(
        <div style={{marginTop:16}}>
          <div style={{fontSize:12,fontWeight:700,color:"var(--text2)",marginBottom:10,textTransform:"uppercase",letterSpacing:".4px"}}>Вільний час {String(selDate).padStart(2,"0")}.{String(month+1).padStart(2,"0")}</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
            {getSlots(selDate).map(t=>(
              <button key={t} onClick={()=>setSelTime(t)}
                style={{padding:"9px 16px",border:"2px solid",borderColor:selTime===t?"var(--blue)":"#E2E8F0",borderRadius:10,background:selTime===t?"var(--grad)":"var(--white)",color:selTime===t?"#fff":"var(--text)",fontWeight:700,fontSize:14,cursor:"pointer",fontFamily:"Manrope",transition:"all .12s"}}>
                {t}
              </button>
            ))}
          </div>
          {selTime&&(
            <button className="btn btn-primary" style={{marginTop:12}} onClick={()=>onSelect(`${String(selDate).padStart(2,"0")}.${String(month+1).padStart(2,"0")}.${year}`,selTime)}>
              <Icon name="check" size={18} color="#fff"/>Обрати {String(selDate).padStart(2,"0")}.{String(month+1).padStart(2,"0")} о {selTime}
            </button>
          )}
        </div>
      )}
    </div>
  );
}

let _globalChats = [];

function AIScreen({onNav}) {
  const [chats,setChats]=useState(()=>[..._globalChats]);
  const [activeId,setActiveId]=useState(null);
  const [view,setView]=useState("list");

  const createChat = () => {
    const id = Date.now().toString();
    const newChat = {
      id, title:"Новий чат",
      created: new Date().toLocaleDateString("uk-UA"),
      messages:[{role:"bot",text:"Привіт! Я AI-асистент психолога Олени.\n\nМожу вислухати, підтримати та допомогти розібратись у своєму стані. Про що хочеш поговорити?"}],
      history:[],
    };
    const updated = [newChat, ...chats];
    _globalChats = updated;
    setChats(updated);
    setActiveId(id);
    setView("chat");
  };

  const updateChat = (id, messages, history, title) => {
    const updated = chats.map(c => c.id===id ? {...c, messages, history, title:title||c.title} : c);
    _globalChats = updated;
    setChats(updated);
  };

  const deleteChat = (id) => {
    const updated = chats.filter(c=>c.id!==id);
    _globalChats = updated;
    setChats(updated);
    if(activeId===id) { setActiveId(null); setView("list"); }
  };

  if(view==="chat" && activeId) {
    const chat = chats.find(c=>c.id===activeId);
    if(!chat) { setView("list"); return null; }
    return <ChatView chat={chat} onBack={()=>setView("list")} onUpdate={updateChat} onDelete={deleteChat}/>;
  }

  return(
    <div>
      <BackBtn onClick={()=>onNav("home")}/>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div className="section-title" style={{marginBottom:0}}>AI-помічник</div>

          <Icon name="plus" size={16} color="#fff"/>Новий чат
        </button>
      </div>

      </div>

        <div className="card" style={{textAlign:"center",padding:"32px 20px"}}>
          <div className="icon-box" style={{width:60,height:60,margin:"0 auto 14px"}}><Icon name="bot" size={30} color="#fff"/></div>

          <div style={{fontSize:13,color:"var(--text2)",marginBottom:16}}>Підтримка 24/7 від AI-асистента</div>
          <button className="btn btn-primary" onClick={createChat}><Icon name="plus" size={18} color="#fff"/>Новий чат</button>
        </div>
      ):(
        chats.map(c=>(
          <div key={c.id} className="chat-session" onClick={()=>{setActiveId(c.id);setView("chat");}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>

                <div style={{width:40,height:40,borderRadius:12,background:"var(--grad)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>

  );

function ChatView({chat, onBack, onUpdate, onDelete}) {
  const [msgs,setMsgs]=useState(chat.messages);
  const [history,setHistory]=useState(chat.history);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const endRef=useRef(null);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:"smooth"});},[msgs,loading]);

  const send = async () => {
    if(!input.trim()||loading)return;
    const txt=input.trim(); setInput(""); setError("");
    const newMsgs=[...msgs,{role:"user",text:txt}];
    const newHist=[...history,{role:"user",content:txt}];
    setMsgs(newMsgs); setHistory(newHist);
    setLoading(true);
    try {
      const res=await fetch(`${PROXY_URL}/chat`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:newHist.slice(-10)})});
      if(!res.ok)throw new Error(`HTTP ${res.status}`);
      const data=await res.json();
      const finalMsgs=[...newMsgs,{role:"bot",text:data.reply}];
      const finalHist=[...newHist,{role:"assistant",content:data.reply}];
      setMsgs(finalMsgs); setHistory(finalHist);
      const title = chat.title==="Новий чат" ? txt.slice(0,30)+(txt.length>30?"...":"") : chat.title;
      onUpdate(chat.id, finalMsgs, finalHist, title);
    } catch(e) {
      setError("Помилка з\'єднання. Спробуй ще раз.");
      setMsgs(newMsgs.slice(0,-1)); setHistory(newHist.slice(0,-1));
    }
    setLoading(false);
  };

  return(
    <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 96px)"}}>
      <button className="back-btn" onClick={onBack}><Icon name="back" size={18} color="var(--blue)"/>Усі чати</button>
      <div className="chat-messages">
        {msgs.map((m,i)=>(
          <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start"}}>
            <div className={`bubble ${m.role==="bot"?"bubble-bot":"bubble-user"}`} style={{whiteSpace:"pre-line"}}>{m.text}</div>
          </div>
        ))}
        {loading&&<div style={{display:"flex",justifyContent:"flex-start"}}><div className="bubble bubble-bot"><span className="dot"/><span className="dot"/><span className="dot"/></div></div>}
        {error&&<div style={{fontSize:12,color:"var(--red)",textAlign:"center",padding:"6px 0"}}>{error}</div>}
        <div ref={endRef}/>
      </div>
      <div className="chat-input-row">
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()} placeholder="Напишіть повідомлення..."/>
        <button className="send-btn" onClick={send} disabled={!input.trim()||loading}><Icon name="send" size={18} color="#fff"/></button>
      </div>
    </div>
  );
}

// ── CHECKIN ───────────────────────────────────────────────────────────
function CheckinScreen({onNav, mood}) {
  const map={
    good:{icon:"heart",title:"Радий чути!",grad:"linear-gradient(135deg,var(--green),#059669)",text:"Підтримуй себе сьогодні:\n• зроби щось маленьке для себе\n• зверни увагу на гарне поруч\n• подякуй собі за сьогоднішній день"},
    ok:{icon:"dot_circle",title:"Нормально — теж добре",grad:"linear-gradient(135deg,#D97706,#B45309)",text:"Що могло б зробити сьогоднішній день трохи кращим?\n\nМожна поговорити з AI-помічником або почитати матеріали."},
    hard:{icon:"brain",title:"Дякую що поділився",grad:"var(--grad)",text:"Важкі дні бувають у всіх. Ти не самотній.\n\nМоя підтримка доступна — через AI-чат або живу консультацію."},
  };
  const c=map[mood]||map.ok;

  useEffect(()=>{
    if(mood==="hard"){
      const user = tg?.initDataUnsafe?.user;
      const userInfo = user ? `@${user.username||"—"} (${user.first_name||""})` : "користувач";
      sendNotify(`🆘 *СТАН «ВАЖКО»*

👤 ${userInfo}

Людина відмітила що їй важко сьогодні. Можливо варто написати.`);
    }
  },[]);

  return(
    <div>
      <div className="card" style={{textAlign:"center",padding:"28px 20px"}}>
        <div style={{width:64,height:64,borderRadius:18,background:c.grad,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px",boxShadow:"0 6px 24px rgba(26,86,219,.25)"}}>
          <Icon name={c.icon} size={32} color="#fff"/>
        </div>
        <div style={{fontSize:18,fontWeight:800,marginBottom:14}}>{c.title}</div>
        <div className="divider"/>
        <p className="pre" style={{textAlign:"left",marginTop:12}}>{c.text}</p>
      </div>
      {mood==="hard"&&<button className="btn btn-primary mt-8" onClick={()=>onNav("booking")}><Icon name="calendar" size={18} color="#fff"/>Записатись до Олени</button>}
      <button className="btn btn-secondary mt-8" onClick={()=>onNav("ai")}><Icon name="bot" size={18} color="var(--blue)"/>Поговорити з AI</button>
      <button className="btn btn-ghost mt-8" onClick={()=>onNav("home")}><Icon name="home" size={16} color="var(--text2)"/>На головну</button>
    </div>
  );
}

// ── NAV ───────────────────────────────────────────────────────────────
const NAV=[
  {screen:"home",icon:"home",label:"Головна"},
  {screen:"test",icon:"clipboard",label:"Тест дня"},
  {screen:"booking",icon:"calendar",label:"Запис"},
  {screen:"ai",icon:"bot",label:"AI-чат"},
];

function App() {
  const [screen,setScreen]=useState("home");
  const [params,setParams]=useState({});
  const scrollRef=useRef(null);
  const nav=(s,p={})=>{setScreen(s);setParams(p);scrollRef.current?.scrollTo({top:0,behavior:"smooth"});};
  const screens={
    home:<HomeScreen onNav={nav}/>,
    about:<AboutScreen onNav={nav}/>,
    topics:<TopicsScreen onNav={nav} initialSel={params.sel}/>,
    test:<TestScreen onNav={nav}/>,
    services:<ServicesScreen onNav={nav}/>,
    booking:<BookingScreen onNav={nav}/>,
    materials:<MaterialsScreen onNav={nav}/>,
    testimonials:<TestimonialsScreen onNav={nav}/>,
    ai:<AIScreen onNav={nav}/>,
    checkin:<CheckinScreen onNav={nav} mood={params.mood}/>,
  };
  return(
    <div className="app">
      <div className="screen" ref={scrollRef}>{screens[screen]||screens.home}</div>
      <nav className="bottom-nav">
        {NAV.map(({screen:s,icon,label})=>(
          <button key={s} className={`nav-item ${screen===s?"active":""}`} onClick={()=>nav(s)}>
            <div className="nav-dot">
              <Icon name={icon} size={22} color={screen===s?"var(--blue)":"var(--text3)"}/>
            </div>
            <span className="nav-label">{label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
