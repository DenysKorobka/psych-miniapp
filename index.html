  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <title>MiniApp Demo — Telegram Mini App</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

  :root{
    --bg:#F0F6FB; 
    --surface:#FFFFFF;
    --surface-alt:#F3F4F6;
    --text:#111827;
    --text-2:#6B7280;
    --text-3:#9CA3AF;
    --primary:#111827;
    --border:#E5E7EB;
    --accent:#0EA5E9;
    --sh:0 4px 16px rgba(0,0,0,.03);
    --sh2:0 8px 32px rgba(0,0,0,.10);
    --font:'Plus Jakarta Sans',-apple-system,sans-serif;
    --r:20px;--r-sm:14px;--r-pill:999px;
  }

  html,body,#root{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;}

  .app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background: radial-gradient(circle at 50% 0%, #E0F2FE 0%, var(--bg) 50%); position:relative;}
  .screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 20px 100px;-webkit-overflow-scrolling:touch;}

  /* NAV */
  .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--surface);border-top:1px solid var(--border);border-radius:24px 24px 0 0;display:flex;align-items:flex-end;justify-content:space-between;height:70px;padding:0 12px;padding-bottom:env(safe-area-inset-bottom);z-index:100;box-shadow:0 -4px 24px rgba(0,0,0,.04);}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;background:none;border:none;cursor:pointer;color:var(--text-3);font-family:var(--font);padding-bottom:12px;height:100%;transition:color .15s;}
  .nav-item.active{color:var(--accent);}
  .nav-icon-wrap{width:28px;height:28px;display:flex;align-items:center;justify-content:center;margin-bottom:2px;transition:transform .2s;}
  .nav-item.active .nav-icon-wrap{transform:translateY(-2px);}
  .nav-label{font-size:10px;font-weight:700;}
  .nav-center-wrap{position:relative;width:64px;display:flex;justify-content:center;}
  .nav-center-btn{position:absolute;bottom:20px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(14,165,233,.4);border:4px solid var(--bg);cursor:pointer;transition:transform .15s;padding:0;}
  .nav-center-btn:active{transform:scale(.95);}

  /* TOPBAR */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:24px 0 16px;}
  .tb-title{font-size:26px;font-weight:800;letter-spacing:-.04em;line-height:1.1;color:var(--text);}
  .tb-sub{font-size:13px;color:var(--text-2);font-weight:500;margin-top:3px;}
  .icon-btn{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--sh);color:var(--text);}

  /* HEADER BACK BTN */
  .back-btn-circle{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh);flex-shrink:0;cursor:pointer;}

  /* HERO CARD */
  .hero{background:var(--primary);border-radius:var(--r);padding:28px 24px;margin-bottom:24px;position:relative;overflow:hidden;}
  .hero-title{font-size:22px;font-weight:800;color:#fff;letter-spacing:-.03em;line-height:1.25;margin-bottom:8px;}
  .hero-sub{font-size:13px;color:rgba(255,255,255,.6);font-weight:500;line-height:1.55;margin-bottom:20px;}

  /* SECTION */
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;margin-top:8px;}
  .sec-title{font-size:18px;font-weight:800;letter-spacing:-.03em;color:var(--text);}

  /* CARDS */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:12px;box-shadow:var(--sh);}

  /* FEATURE GRID */
  .feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}

  /* LIST */
  .list-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:var(--sh);transition:transform .12s;}
  .list-item:active{transform:scale(.98);}
  .li-body{flex:1;min-width:0;}
  .li-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px;}
  .li-sub{font-size:12px;font-weight:500;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* BUTTONS */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:17px;border:none;border-radius:var(--r-pill);font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer;transition:transform .1s;}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.5;pointer-events:none;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-accent{background:var(--accent);color:#fff;box-shadow:0 6px 20px rgba(14,165,233,.3);}
  .btn-secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--border);box-shadow:var(--sh);}
  .btn-ghost{background:transparent;color:var(--text-2);border:1.5px solid var(--border);}
  .mt{margin-top:12px;}

  /* BADGE */
  .badge{display:inline-flex;align-items:center;gap:4px;border-radius:var(--r-pill);padding:4px 10px;font-size:11px;font-weight:700;border:1px solid var(--border);background:var(--surface);}

  /* INPUT */
  .field-label{display:block;font-size:11px;font-weight:800;color:var(--text-2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px;margin-top:16px;}
  .field{width:100%;padding:15px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-family:var(--font);font-size:15px;background:var(--surface-alt);color:var(--text);outline:none;transition:border .2s;}
  .field:focus{border-color:var(--text);background:var(--surface);}
  textarea.field{resize:none;}

  /* PROGRESS */
  .prog-wrap{height:5px;background:var(--border);border-radius:999px;overflow:hidden;margin-bottom:28px;}
  .prog-fill{height:100%;background:var(--text);border-radius:999px;transition:width .3s;}

  /* CALENDAR */
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .cal-nav-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-wd{text-align:center;font-size:10px;font-weight:800;color:var(--text-3);padding-bottom:10px;}
  .cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;border-radius:50%;border:none;background:transparent;color:var(--text);cursor:pointer;font-family:var(--font);}
  .cal-cell.avail{background:var(--surface-alt);}
  .cal-cell.sel{background:var(--text);color:#fff;font-weight:800;}
  .cal-cell.past{color:var(--text-3);cursor:default;}
  .time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;}
  .time-slot{padding:13px;text-align:center;border:1.5px solid var(--border);border-radius:12px;font-size:14px;font-weight:700;color:var(--text);background:var(--surface);cursor:pointer;font-family:var(--font);}
  .time-slot.sel{border-color:var(--text);background:var(--text);color:#fff;}

  /* CHAT */
  .chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 76px);}
  .chat-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:16px 0;}
  .bubble{max-width:84%;padding:13px 17px;border-radius:18px;font-size:14px;line-height:1.6;font-weight:500;}
  .b-bot{background:var(--surface);color:var(--text);border-bottom-left-radius:4px;box-shadow:var(--sh);border:1px solid var(--border);}
  .b-user{background:var(--primary);color:#fff;border-bottom-right-radius:4px;align-self:flex-end;}
  .chat-bar{padding:10px 0;display:flex;gap:8px;}
  .chat-input{flex:1;border:1.5px solid var(--border);border-radius:var(--r-pill);padding:0 18px;font-family:var(--font);font-size:15px;background:var(--surface);outline:none;height:48px;}
  .send-btn{width:48px;height:48px;border-radius:50%;background:var(--primary);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}

  /* TABS */
  .tabs{display:flex;background:var(--surface-alt);border-radius:14px;padding:3px;margin-bottom:20px;border:1px solid var(--border);}
  .tab-btn{flex:1;padding:10px;border-radius:11px;font-size:13px;font-weight:700;border:none;background:transparent;color:var(--text-2);cursor:pointer;font-family:var(--font);transition:all .2s;}
  .tab-btn.on{background:var(--surface);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.05);border:1px solid var(--border);}

  /* REVIEW */
  .review-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;margin-bottom:12px;box-shadow:var(--sh);}
  .review-stars{display:flex;gap:3px;margin-bottom:12px;}
  .review-text{font-size:14px;color:var(--text);line-height:1.7;font-weight:500;margin-bottom:14px;}
  .review-author{display:flex;align-items:center;gap:10px;}
  .review-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--text);border:1px solid var(--border);}

  /* PLAN CARD */
  .plan-card{border-radius:var(--r);padding:20px;margin-bottom:12px;cursor:pointer;border:1px solid var(--border);transition:all .2s;background:var(--surface);}
  .plan-card.selected{border-color:var(--text);box-shadow:var(--sh2);}
  .plan-check{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:auto;}
  .plan-card.selected .plan-check{background:var(--text);border-color:var(--text);}

  /* SUCCESS */
  .success-wrap{text-align:center;padding:48px 0 32px;}

  /* NOTIFICATION PULSE */
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--text);display:inline-block;animation:pulse 1.5s infinite;}
  .red-dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:#EF4444;border:2px solid var(--surface);}

  /* TYPING */
  @keyframes blink{0%,100%{opacity:0}50%{opacity:1}}
  .tdot{width:7px;height:7px;border-radius:50%;background:var(--text-3);display:inline-block;margin:0 2px;animation:blink 1.2s infinite;}
  .tdot:nth-child(2){animation-delay:.2s}.tdot:nth-child(3){animation-delay:.4s}

  /* FADE IN */
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .fade-in{animation:fadeUp .4s ease both;}

  .divider{height:1px;background:var(--border);margin:16px 0;}

  /* CONFIRM ROW */
  .conf-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
  .conf-row:last-child{border:none;}
  .conf-lbl{font-size:10px;font-weight:800;color:var(--text-3);width:80px;flex-shrink:0;padding-top:2px;text-transform:uppercase;letter-spacing:.6px;}
  .conf-val{font-size:14px;font-weight:600;color:var(--text);line-height:1.4;}
  </style>
</head>

function CalPicker({onSelect}) {
  const today=new Date();
  const [month,setMonth]=useState(today.getMonth());
  const [year,setYear]=useState(today.getFullYear());
  const [selD,setSelD]=useState(null);
  const [selT,setSelT]=useState(null);
  const MONTHS=["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
  const DAYS=["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];
  const dim=new Date(year,month+1,0).getDate();
  let fd=new Date(year,month,1).getDay();fd=fd===0?6:fd-1;
  const fmt=d=>`${String(d).padStart(2,"0")}.${String(month+1).padStart(2,"0")}.${year}`;
  const isPast=d=>new Date(year,month,d)<new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const getSlots=d=>{const dow=new Date(year,month,d).getDay()||7;return SCHEDULE[dow]||[];};
  const cells=[];for(let i=0;i<fd;i++)cells.push(null);for(let d=1;d<=dim;d++)cells.push(d);
  return(
    <div>
      <div className="cal-nav">
        <button className="cal-nav-btn" onClick={()=>{month===0?(setMonth(11),setYear(y=>y-1)):setMonth(m=>m-1);setSelD(null);setSelT(null);}}><IC n="back" sz={18}/></button>
        <div style={{fontSize:15,fontWeight:800}}>{MONTHS[month]} {year}</div>
        <button className="cal-nav-btn" style={{transform:"rotate(180deg)"}} onClick={()=>{month===11?(setMonth(0),setYear(y=>y+1)):setMonth(m=>m+1);setSelD(null);setSelT(null);}}><IC n="back" sz={18}/></button>
      </div>
      <div className="cal-grid" style={{marginBottom:6}}>
        {DAYS.map(d=><div key={d} className="cal-wd">{d}</div>)}
      </div>
      <div className="cal-grid">
        {cells.map((d,i)=>{
          if(!d)return<div key={i}/>;
          const past=isPast(d),slots=getSlots(d).length>0,sel=selD===d;
          return<button key={i} className={`cal-cell ${sel?"sel":past?"past":slots?"avail":""}`} onClick={()=>{if(!past&&slots){setSelD(d);setSelT(null);}}}>{d}</button>;
        })}
      </div>
      {selD&&(
        <>
          <div style={{fontSize:12,fontWeight:800,color:"var(--text-2)",textTransform:"uppercase",letterSpacing:".8px",margin:"16px 0 8px"}}>Вільний час</div>
          <div className="time-grid">
            {getSlots(selD).map(t=>(
              <button key={t} className={`time-slot ${selT===t?"sel":""}`} onClick={()=>setSelT(t)}>{t}</button>
            ))}
          </div>
          {selT&&<button className="btn btn-primary mt" style={{marginTop:16}} onClick={()=>onSelect(fmt(selD),selT)}>Продовжити</button>}
        </>
      )}
    </div>
  );
}

  who: "**Хто замовляє:**\n\nМіні-додаток підійде будь-якому спеціалісту який працює з людьми:\n\n• Психологи та коучи\n• Тренери та фітнес\n• Б'юті-майстри\n• Репетитори\n• Лікарі та нутриціологи\n• Ресторани та кафе\n\nЯкщо у вас є клієнти — міні-додаток заощадить вам час.",
  economy: "**Скільки часу економить:**\n\nВ середньому по нашим клієнтам:\n\n• 15-20 год/міс на координацію записів\n• 3-5 год/міс на переписку з питаннями\n• 2-3 год/міс на нагадування\n\nРазом: **20-28 год/міс** — це майже цілий робочий тиждень!\n\nПлюс зникають пропуски клієнтів (у середньому -4 пропуски на місяць).",
  zapys: "**Як залишити заявку:**\n\n1. Натисніть кнопку «Замовити додаток» в меню\n2. Заповніть коротку форму (2 хвилини)\n3. Я зв'яжусь з вами протягом кількох годин\n4. Проведемо короткий дзвінок\n5. Починаємо розробку!\n\nАбо напишіть прямо — і я вам відповім особисто.",
};

function getAIResponse(msg) {
  const m = msg.toLowerCase();
  if(m.includes("ціна")||m.includes("кошт")||m.includes("скільки")||m.includes("гроши")||m.includes("грн")||m.includes("ціни")) return AI_ANSWERS.price;
  if(m.includes("час")||m.includes("термін")||m.includes("скіл")||m.includes("коли")||m.includes("довго")) return AI_ANSWERS.time;
  if(m.includes("функц")||m.includes("що вміє")||m.includes("можливост")||m.includes("що є")||m.includes("що є")) return AI_ANSWERS.features;
  if(m.includes("кому")||m.includes("для кого")||m.includes("підійде")||m.includes("ваш")||m.includes("фітнес")||m.includes("психол")||m.includes("тренер")) return AI_ANSWERS.who;
  if(m.includes("економ")||m.includes("час")||m.includes("час")||m.includes("автом")||m.includes("рутин")||m.includes("скільки")||m.includes("вигод")) return AI_ANSWERS.economy;
  if(m.includes("заявк")||m.includes("замовит")||m.includes("хочу")||m.includes("як")||m.includes("оформ")) return AI_ANSWERS.zapys;
  return AI_ANSWERS.default;
}

function AiScreen({onNav}) {
  const [msgs,setMsgs]=useState([
    {role:"bot",text:"Привіт! Я AI-асистент, який допоможе розповісти про Telegram Mini App для вашого бізнесу.\n\nПитайте про що хочете:\n• Скільки коштує?\n• Які функції?\n• Для кого підходить?\n• Як замовити?\n\nАбо просто напишіть своє запитання!"}
  ]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const endRef=useRef(null);
  const quickQ=["Скільки коштує?","Які функції?","Як зекономити час?","Як замовити?"];

  useEffect(()=>{endRef.current?.scrollIntoView({behavior:"smooth"});},[msgs,loading]);

  const send = async (text) => {
    const txt = (text || input).trim();
    if (!txt || loading) return;
    
    setInput("");
    const newMsgs = [...msgs, { role: "user", text: txt }];
    setMsgs(newMsgs);
    setLoading(true);

    try {
      // Підготовка повідомлень у форматі Gemini
      const apiMessages = newMsgs.slice(1).map(m => ({
        role: m.role === "bot" ? "model" : "user",
        parts: [{ text: m.text }]
      }));

      let response;
      let delay = 1000;
      
      // Механізм повторних спроб (якщо мережа моргнула або сервер зайнятий)
      for (let i = 0; i < 5; i++) {
        try {
          response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              systemInstruction: {
                parts: [{ text: "Ти привітний та професійний AI-асистент для Telegram Mini App (демо-версія додатку для запису клієнтів). Ти консультуєш людей щодо функціоналу, цін та можливостей розробки такого додатку для їхнього бізнесу (фітнес, б'юті, психологи тощо). Спілкуйся виключно українською мовою. Відповідай лаконічно, з використанням емодзі. Форматуй важливий текст за допомогою **жирного шрифту**." }]
              },
              contents: apiMessages
            })
          });
          if (response.ok) break;
        } catch (e) {
          if (i === 4) throw e;
        }
        if (i < 4) {
          await new Promise(r => setTimeout(r, delay));
          delay *= 2;
        }
      }

      const data = await response?.json();
      
      if (!response?.ok) {
        throw new Error(data?.error?.message || "Помилка API: " + response?.status);
      }
      
      const replyText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (replyText) {
        setMsgs([...newMsgs, { role: "bot", text: replyText }]);
      } else {
        throw new Error("Отримано порожню відповідь від API");
      }
    } catch (error) {
      console.warn("Gemini API тимчасово недоступний. Використовуємо резервні демо-відповіді.", error);
      await new Promise(r => setTimeout(r, 600));
      const fallbackReply = getAIResponse(txt);
      setMsgs([...newMsgs, { role: "bot", text: fallbackReply }]);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="chat-wrap">
      <Header 
        onBack={()=>onNav("home")} 
        title="AI Асистент" 
        icon="bot"
        sub={<span style={{display:"flex",alignItems:"center",gap:4}}><span className="pulse-dot" style={{width:6,height:6}}/> Онлайн</span>} 
        right={
          <button onClick={()=>onNav("order")} className="btn btn-accent" style={{width:"auto",padding:"8px 14px",fontSize:12}}>
            Замовити
          </button>
        }
      />

      <div style={{background:"var(--surface-alt)", padding:"12px 16px", borderRadius:"var(--r-sm)", border:"1px solid var(--border)", display:"flex", gap:"12px", alignItems:"center", flexShrink:0, margin:"0 0 16px 0"}}>
        <div style={{width:32, height:32, borderRadius:10, background:"var(--surface)", border:"1px solid var(--border)", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0}}>
          <IC n="bot" sz={18} c="var(--text)"/>
        </div>
        <div style={{fontSize:13, fontWeight:500, color:"var(--text)", lineHeight:1.4}}>
          Такий самий розумний помічник може бути вбудований у <b>вашому додатку</b> для відповідей клієнтам 24/7.
        </div>
      </div>

      <div className="chat-scroll">
        {msgs.map((m,i)=>(
          <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start"}}>
            <div className={`bubble ${m.role==="bot"?"b-bot":"b-user"}`} style={{whiteSpace:"pre-line"}}>
              {m.text.split(/(\*\*.*?\*\*)/g).map((part, idx) => 
                part.startsWith('**') && part.endsWith('**') ? <b key={idx}>{part.slice(2, -2)}</b> : part
              )}
            </div>
          </div>
        ))}
        {loading&&(
          <div style={{display:"flex"}}>
            <div className="bubble b-bot"><span className="tdot"/><span className="tdot"/><span className="tdot"/></div>
          </div>
        )}
        <div ref={endRef}/>
      </div>

      {/* Quick questions */}
      <div style={{display:"flex",gap:8,overflowX:"auto",padding:"8px 0",scrollbarWidth:"none"}}>
        {quickQ.map((q,i)=>(
          <button key={i} onClick={()=>send(q)} style={{flexShrink:0,padding:"7px 12px",border:"1px solid var(--border)",borderRadius:"999px",background:"var(--surface)",fontSize:12,fontWeight:700,color:"var(--text)",cursor:"pointer",fontFamily:"var(--font)"}}>
            {q}
          </button>
        ))}
      </div>

      <div className="chat-bar">
        <input className="chat-input" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()} placeholder="Написати питання..."/>
        <button className="send-btn" onClick={()=>send()} disabled={!input.trim()||loading}><IC n="send" sz={18} c="#fff"/></button>
      </div>
    </div>
  );
}

function OrderScreen({onNav}) {
  const [step,setStep]=useState(0);
  const [plan,setPlan]=useState("pro");
  const [form,setForm]=useState({name:"",telegram:"",business:"",comment:""});
  const [sending,setSending]=useState(false);

  const submit = async () => {
    setSending(true);
    const tg = window.Telegram?.WebApp;
    const tgUser = tg?.initDataUnsafe?.user;
    const tgProfile = tgUser?.id ? `<a href="tg://user?id=${tgUser.id}">${tgUser.first_name}</a> ${tgUser.username ? '(@' + tgUser.username + ')' : ''}` : "Не визначено (відкрито в браузері)";
    const planName = PLANS.find(p=>p.id===plan)?.name || plan;
    const msg = `🚀 <b>Нова заявка на додаток!</b>\n\n👤 <b>Ім'я:</b> ${form.name}\n✈️ <b>Telegram (введено):</b> ${form.telegram}\n📱 <b>Telegram профіль:</b> ${tgProfile}\n💼 <b>Бізнес:</b> ${form.business}\n📦 <b>Тариф:</b> ${planName}\n💬 <b>Коментар:</b> ${form.comment || "Немає"}`;
    await sendTelegramMessage(msg);
    
    await new Promise(r=>setTimeout(r,800));
    setSending(false);
    setStep(2);
  };

  if(step===2) return (
    <div className="success-wrap fade-in">
      <div style={{width:80,height:80,borderRadius:24,border:'1px solid var(--border)',display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 24px"}}>
        <IC n="check" sz={40} c="var(--text)"/>
      </div>
      <div style={{fontSize:24,fontWeight:800,letterSpacing:"-.03em",marginBottom:8}}>Заявку отримано!</div>
      <div style={{fontSize:15,color:"var(--text-2)",marginBottom:32,lineHeight:1.5,padding:"0 20px"}}>
        Я зв'яжусь з вами у Telegram протягом кількох годин. Готуйтесь — ваш бізнес скоро стане значно простішим!
      </div>
      <div className="card" style={{textAlign:"left",marginBottom:20}}>
        <div style={{fontSize:12,fontWeight:800,color:"var(--text-2)",textTransform:"uppercase",letterSpacing:".8px",marginBottom:12}}>Що далі:</div>
        {[
          { icon: 'phone', text: 'Короткий дзвінок для уточнення деталей' },
          { icon: 'layers', text: 'Технічне завдання та дизайн-бриф' },
          { icon: 'zap', text: 'Розробка (5-14 днів залежно від тарифу)' },
          { icon: 'check', text: 'Тестування та запуск вашого додатка' }
        ].map((p,i)=>(
          <div key={i} style={{fontSize:13,fontWeight:500,padding:"8px 0",borderBottom:i<3?"1px solid var(--border)":"none",display:"flex",alignItems: 'center', gap:"10px"}}>
            <IC n={p.icon} sz={16} c="var(--text)"/>
            <span>{p.text}</span>
          </div>
        ))}
      </div>
      <button className="btn btn-primary" onClick={()=>onNav("home")}>На головну</button>
    </div>
  );

  return (
    <div>
      <Header onBack={()=>step===0?onNav("home"):setStep(0)} title="Замовити додаток" />

      {step===0 && (
        <>
          <div style={{fontSize:13,fontWeight:700,color:"var(--text-2)",marginBottom:20,lineHeight:1.6}}>
            Оберіть тариф або напишіть у формі нижче — я підберу оптимальне рішення для вашого бізнесу.
          </div>
          {PLANS.map(p=>(
            <div key={p.id} className={`plan-card ${plan===p.id?"selected":""}`} onClick={()=>setPlan(p.id)}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                {p.hot && <span style={{border:'1px solid var(--text)',color:'var(--text)',fontSize:10,fontWeight:800,padding:"3px 8px",borderRadius:"999px"}}>ПОПУЛЯРНЕ</span>}
                <div style={{fontSize:17,fontWeight:800,color:'var(--text)',flex:1}}>{p.name}</div>
                <div className="plan-check">{plan===p.id && <IC n="check" sz={12} c="#fff"/>}</div>
              </div>
              <div style={{fontSize:22,fontWeight:800,color:'var(--text)',letterSpacing:"-.03em",marginBottom:6}}>{p.price}</div>
              <div style={{fontSize:13,color:'var(--text-2)',fontWeight:500,marginBottom:12}}>{p.desc}</div>
              {p.features.map((f,i)=>(
                <div key={i} style={{fontSize:13,fontWeight:500,color:'var(--text-2)',display:"flex",gap:6,alignItems:"center",paddingTop:4}}>
                  <IC n="check" sz={14} c="var(--text)"/>{f}
                </div>
              ))}
            </div>
          ))}
          <button className="btn btn-accent mt" style={{marginTop:20}} onClick={()=>setStep(1)}>
            Продовжити →
          </button>
        </>
      )}

      {step===1 && (
        <>
          <div className="card" style={{background:"var(--surface-alt)",border:"none",marginBottom:20}}>
            <div style={{fontSize:12,fontWeight:800,color:"var(--text-2)",textTransform:"uppercase",letterSpacing:".8px",marginBottom:4}}>Обраний тариф</div>
            <div style={{fontSize:16,fontWeight:800}}>{PLANS.find(p=>p.id===plan)?.name} · {PLANS.find(p=>p.id===plan)?.price}</div>
          </div>

          <label className="field-label">Ваше ім'я</label>
          <input className="field" autoFocus value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Як до вас звертатися?"/>

          <label className="field-label">Telegram для зв'язку</label>
          <input className="field" value={form.telegram} onChange={e=>setForm({...form,telegram:e.target.value})} placeholder="@username"/>

          <label className="field-label">Ваш бізнес / діяльність</label>
          <input className="field" value={form.business} onChange={e=>setForm({...form,business:e.target.value})} placeholder="Психолог / Тренер / Майстер..."/>

          <label className="field-label">Коментар (необов'язково)</label>
          <textarea className="field" rows={3} value={form.comment} onChange={e=>setForm({...form,comment:e.target.value})} placeholder="Особливі побажання або питання"/>

          <button className="btn btn-accent mt" style={{marginTop:20}} disabled={!form.name.trim()||!form.telegram.trim()||sending} onClick={submit}>
            {sending?"Відправляємо...":"Надіслати заявку"}
          </button>
          <div style={{fontSize:12,color:"var(--text-3)",textAlign:"center",marginTop:12,fontWeight:500}}>
            Я зв'яжусь з вами протягом кількох годин
          </div>
        </>
      )}
    </div>
  );
}

// ─────────────────────────────────────────
//  NAV + APP
// ─────────────────────────────────────────
const NAV_LEFT = [
  {screen:"home", icon:"home", label:"Головна"},
  {screen:"features_list", icon:"layers", label:"Можливості"}
];
const NAV_RIGHT = [
  {screen:"reviews", icon:"star", label:"Відгуки"},
  {screen:"ai", icon:"bot", label:"AI-чат"}
];

function App() {
  const [screen,setScreen]=useState("home");
  const [params,setParams]=useState({});
  const scrollRef=useRef(null);

  const nav = (s,p={}) => {
    setScreen(s);
    setParams(p);
    scrollRef.current?.scrollTo({top:0,behavior:"smooth"});
  };

  const screens = {
    home:          <HomeScreen         onNav={nav}/>,
    features_list: <FeaturesListScreen onNav={nav}/>,
    feature:       <FeatureScreen      onNav={nav} params={params}/>,
    niche:         <NicheScreen        onNav={nav} params={params}/>,
    booking:       <BookingScreen      onNav={nav}/>,
    sessions:      <SessionsScreen     onNav={nav}/>,
    notify:        <NotifyScreen       onNav={nav}/>,
    reviews:       <ReviewsScreen      onNav={nav}/>,
    ai:            <AiScreen           onNav={nav}/>,
    order:         <OrderScreen        onNav={nav}/>,
  };

  const mainScreens = ["home","features_list","reviews","ai","order"];

  return (
    <div className="app">
      <div className="screen" ref={scrollRef}>
        {screens[screen] || screens.home}
      </div>
      {mainScreens.includes(screen) && (
        <nav className="bottom-nav">
          {NAV_LEFT.map((item)=>(
            <button key={item.screen} className={`nav-item ${screen===item.screen?"active":""}`} onClick={()=>nav(item.screen)}>
              <div className="nav-icon-wrap"><IC n={item.icon} sz={24} c="currentColor"/></div>
              <span className="nav-label">{item.label}</span>
            </button>
          ))}
          
          <div className="nav-center-wrap">
            <button className="nav-center-btn" onClick={()=>nav("order")}>
              <IC n="sparkle" sz={26} c="#fff"/>
            </button>
          </div>

          {NAV_RIGHT.map((item)=>(
            <button key={item.screen} className={`nav-item ${screen===item.screen?"active":""}`} onClick={()=>nav(item.screen)}>
              <div className="nav-icon-wrap"><IC n={item.icon} sz={24} c="currentColor"/></div>
              <span className="nav-label">{item.label}</span>
            </button>
          ))}
        </nav>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
