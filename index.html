<html lang="uk">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <title>MiniApp Demo — Telegram Mini App</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

  :root{
    --bg:#F0F6FB; 
    --surface:#FFFFFF;
    --surface-alt:#F3F4F6;
    --text:#111827;
    --text-2:#6B7280;
    --text-3:#9CA3AF;
    --primary:#111827;
    --border:#E5E7EB;
    --accent:#0EA5E9;
    --sh:0 4px 16px rgba(0,0,0,.03);
    --sh2:0 8px 32px rgba(0,0,0,.10);
    --font:'Plus Jakarta Sans',-apple-system,sans-serif;
    --r:20px;--r-sm:14px;--r-pill:999px;
  }

  html,body,#root{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;}

  .app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background: radial-gradient(circle at 50% 0%, #E0F2FE 0%, var(--bg) 50%); position:relative;}
  .screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 20px 100px;-webkit-overflow-scrolling:touch;}

  /* NAV */
  .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--surface);border-top:1px solid var(--border);border-radius:24px 24px 0 0;display:flex;align-items:flex-end;justify-content:space-between;height:70px;padding:0 12px;padding-bottom:env(safe-area-inset-bottom);z-index:100;box-shadow:0 -4px 24px rgba(0,0,0,.04);}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;background:none;border:none;cursor:pointer;color:var(--text-3);font-family:var(--font);padding-bottom:12px;height:100%;transition:color .15s;}
  .nav-item.active{color:var(--accent);}
  .nav-icon-wrap{width:28px;height:28px;display:flex;align-items:center;justify-content:center;margin-bottom:2px;transition:transform .2s;}
  .nav-item.active .nav-icon-wrap{transform:translateY(-2px);}
  .nav-label{font-size:10px;font-weight:700;}
  .nav-center-wrap{position:relative;width:64px;display:flex;justify-content:center;}
  .nav-center-btn{position:absolute;bottom:20px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(14,165,233,.4);border:4px solid var(--bg);cursor:pointer;transition:transform .15s;padding:0;}
  .nav-center-btn:active{transform:scale(.95);}

  /* TOPBAR */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:24px 0 16px;}
  .tb-title{font-size:26px;font-weight:800;letter-spacing:-.04em;line-height:1.1;color:var(--text);}
  .tb-sub{font-size:13px;color:var(--text-2);font-weight:500;margin-top:3px;}
  .icon-btn{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--sh);color:var(--text);}
  .back-btn-circle{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh);flex-shrink:0;cursor:pointer;color:var(--text);}

  /* CARDS */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:12px;box-shadow:var(--sh);}

  /* LIST ITEM */
  .list-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:var(--sh);transition:transform .12s;}
  .list-item:active{transform:scale(.98);}
  .li-body{flex:1;min-width:0;}
  .li-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px;}
  .li-sub{font-size:12px;font-weight:500;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* BUTTONS */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:17px;border:none;border-radius:var(--r-pill);font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer;transition:transform .1s;}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.5;pointer-events:none;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-accent{background:var(--accent);color:#fff;box-shadow:0 6px 20px rgba(14,165,233,.3);}
  .btn-secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--border);box-shadow:var(--sh);}
  .mt{margin-top:12px;}

  /* INPUTS */
  .field-label{display:block;font-size:11px;font-weight:800;color:var(--text-2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px;margin-top:16px;}
  .field{width:100%;padding:15px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-family:var(--font);font-size:15px;background:var(--surface-alt);color:var(--text);outline:none;transition:border .2s;}
  .field:focus{border-color:var(--text);background:var(--surface);}
  textarea.field{resize:none;}

  /* CHAT */
  .chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 76px);}
  .chat-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:16px 0;}
  .bubble{max-width:84%;padding:13px 17px;border-radius:18px;font-size:14px;line-height:1.6;font-weight:500;}
  .b-bot{background:var(--surface);color:var(--text);border-bottom-left-radius:4px;box-shadow:var(--sh);border:1px solid var(--border);}
  .b-user{background:var(--primary);color:#fff;border-bottom-right-radius:4px;align-self:flex-end;}
  .chat-bar{padding:10px 0;display:flex;gap:8px;}
  .chat-input{flex:1;border:1.5px solid var(--border);border-radius:var(--r-pill);padding:0 18px;font-family:var(--font);font-size:15px;background:var(--surface);outline:none;height:48px;}
  .send-btn{width:48px;height:48px;border-radius:50%;background:var(--primary);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}

  /* CALENDAR CELLS */
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .cal-nav-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-wd{text-align:center;font-size:10px;font-weight:800;color:var(--text-3);padding-bottom:10px;}
  .cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;border-radius:50%;border:none;background:transparent;color:var(--text);cursor:pointer;font-family:var(--font);}
  .cal-cell.avail{background:var(--surface-alt);}
  .cal-cell.sel{background:var(--text);color:#fff;font-weight:800;}
  .cal-cell.past{color:var(--text-3);cursor:default;}
  .time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;}
  .time-slot{padding:13px;text-align:center;border:1.5px solid var(--border);border-radius:12px;font-size:14px;font-weight:700;color:var(--text);background:var(--surface);cursor:pointer;font-family:var(--font);}
  .time-slot.sel{border-color:var(--text);background:var(--text);color:#fff;}

  /* ANIMATIONS & SUCCESS */
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--text);display:inline-block;animation:pulse 1.5s infinite;}
  .red-dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:#EF4444;border:2px solid var(--surface);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .fade-in{animation:fadeUp .4s ease both;}
  @keyframes blink{0%,100%{opacity:0}50%{opacity:1}}
  .tdot{width:7px;height:7px;border-radius:50%;background:var(--text-3);display:inline-block;margin:0 2px;animation:blink 1.2s infinite;}
  .tdot:nth-child(2){animation-delay:.2s} .tdot:nth-child(3){animation-delay:.4s}

  .divider{height:1px;background:var(--border);margin:16px 0;}
  .prog-wrap{height:5px;background:var(--border);border-radius:999px;overflow:hidden;margin-bottom:28px;}
  .prog-fill{height:100%;background:var(--text);border-radius:999px;transition:width .3s;}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;margin-top:8px;}
  .sec-title{font-size:18px;font-weight:800;letter-spacing:-.03em;color:var(--text);}
  
  /* MINIMALIST SUCCESS */
  .success-wrap-min{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 120px);padding:0 24px;text-align:center;}
  .success-title-min{font-size:24px;font-weight:800;letter-spacing:-.03em;color:var(--text);margin-bottom:8px;}
  .success-sub-min{font-size:15px;color:var(--text-2);line-height:1.6;font-weight:500;margin-bottom:40px;}

  /* TABS */
  .tabs{display:flex;background:var(--surface-alt);border-radius:14px;padding:3px;margin-bottom:20px;border:1px solid var(--border);}
  .tab-btn{flex:1;padding:10px;border-radius:11px;font-size:13px;font-weight:700;border:none;background:transparent;color:var(--text-2);cursor:pointer;font-family:var(--font);transition:all .2s;}
  .tab-btn.on{background:var(--surface);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.05);border:1px solid var(--border);}

  .review-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;margin-bottom:12px;box-shadow:var(--sh);}
  .review-stars{display:flex;gap:3px;margin-bottom:12px;}
  .review-text{font-size:14px;color:var(--text);line-height:1.7;font-weight:500;margin-bottom:14px;}
  .review-author{display:flex;align-items:center;gap:10px;}
  .review-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--text);border:1px solid var(--border);}
  
  .plan-card{border-radius:var(--r);padding:20px;margin-bottom:12px;cursor:pointer;border:1px solid var(--border);transition:all .2s;background:var(--surface);}
  .plan-card.selected{border-color:var(--text);box-shadow:var(--sh2);}
  .plan-check{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:auto;}
  .plan-card.selected .plan-check{background:var(--text);border-color:var(--text);}
  </style>
</head>

};

const sendTelegramMessage = async (text) => {
  if (!TG_BOT_TOKEN || !TG_CHAT_ID) return;
  try {
    await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {

function CalPicker({onSelect}) {
  const today=new Date();
  const [month,setMonth]=useState(today.getMonth());
  const [year,setYear]=useState(today.getFullYear());
  const [selD,setSelD]=useState(null);
  const [selT,setSelT]=useState(null);
  const MONTHS=["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
  const DAYS=["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];
  const dim=new Date(year,month+1,0).getDate();
  let fd=new Date(year,month,1).getDay();fd=fd===0?6:fd-1;
  const fmt=d=>`${String(d).padStart(2,"0")}.${String(month+1).padStart(2,"0")}.${year}`;
  const isPast=d=>new Date(year,month,d)<new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const getSlots=d=>{const dow=new Date(year,month,d).getDay()||7;return SCHEDULE[dow]||[];};
  const cells=[];for(let i=0;i<fd;i++)cells.push(null);for(let d=1;d<=dim;d++)cells.push(d);
  
  return(
    <div>
      <div className="cal-nav">
        <button className="cal-nav-btn" onClick={()=>{month===0?(setMonth(11),setYear(y=>y-1)):setMonth(m=>m-1);setSelD(null);setSelT(null);}}><IC n="back" sz={18}/></button>

      </div>
      <div className="cal-grid" style={{marginBottom:6}}>
        {DAYS.map(d=><div key={d} className="cal-wd">{d}</div>)}

      <div className="cal-grid">
        {cells.map((d,i)=>{
          if(!d)return<div key={i}/>;
          const past=isPast(d),slots=getSlots(d).length>0,sel=selD===d;
          return<button key={i} className={`cal-cell ${sel?"sel":past?"past":slots?"avail":""}`} onClick={()=>{if(!past&&slots){setSelD(d);setSelT(null);}}}>{d}</button>;
        })}

      {selD&&(
        <div className="fade-in">
          <div style={{fontSize:12,fontWeight:800,color:"var(--text-2)",textTransform:"uppercase",letterSpacing:".8px",margin:"16px 0 8px"}}>Вільний час</div>

              <button key={t} className={`time-slot ${selT===t?"sel":""}`} onClick={()=>setSelT(t)}>{t}</button>
            ))}
          </div>
          {selT&&<button className="btn btn-primary mt fade-in" style={{marginTop:16}} onClick={()=>onSelect(fmt(selD),selT)}>Продовжити</button>}
        </div>
      )}
    </div>
  );
}

function AiScreen({onNav}) {
  const [msgs,setMsgs]=useState([{role:"bot",text:"Привіт! Я AI-асистент. Чим можу допомогти?"}]);
  const [input,setInput]=useState(""); const [loading,setLoading]=useState(false);
  const endRef=useRef(null); useEffect(()=>endRef.current?.scrollIntoView({behavior:"smooth"}),[msgs,loading]);
  const quickQ=["Скільки коштує?","Які функції?","Як зекономити час?","Як замовити?"];

  const send = async (text) => {
    const txt = (text || input).trim(); if (!txt || loading) return;
    setInput(""); setMsgs([...msgs, {role:"user", text:txt}]); setLoading(true);
    try {
      const apiMsgs = msgs.concat({role:"user", text:txt}).map(m => ({
          role: m.role === "bot" ? "model" : "user",
          parts: [{ text: m.text }]
      }));
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
        method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ contents: apiMsgs, systemInstruction: {parts:[{text: "Ти асистент для Telegram Mini App. Відповідай українською, лаконічно. КАТЕГОРИЧНО заборонено використовувати будь-які емодзі. Використовуй тільки звичайний текст."}]} })
      });
      const data = await res.json();
      setMsgs(prev=>[...prev, {role:"bot", text:data?.candidates?.[0]?.content?.parts?.[0]?.text || "Вибачте, виникла помилка."}]);
    } catch (e) { setMsgs(prev=>[...prev, {role:"bot", text:"Спробуйте пізніше."}]); }
    finally { setLoading(false); }
  };

  return (
    <div className="chat-wrap fade-in">
      <Header onBack={()=>onNav("home")} title="AI Асистент" sub="Онлайн 24/7" icon="bot" />
      <div style={{background:"var(--surface-alt)", padding:12, borderRadius:12, margin:"0 16px 16px", fontSize:13, border: "1px solid var(--border)"}}>Такий помічник може бути вбудований у ваш власний додаток.</div>
      <div className="chat-scroll" style={{padding:"0 16px 16px"}}>
        {msgs.map((m,i)=>(
          <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start"}}>
            <div className={`bubble ${m.role==="bot"?"b-bot":"b-user"}`} style={{whiteSpace:"pre-line"}}>
              {m.text.split(/(\*\*.*?\*\*)/g).map((part, idx) => part.startsWith('**') ? <b key={idx}>{part.slice(2,-2)}</b> : part)}
            </div>
          </div>
        ))}
        {loading && <div className="bubble b-bot"><span className="tdot"/><span className="tdot"/><span className="tdot"/></div>}
        <div ref={endRef}/>
      </div>
      
      <div style={{display:"flex",gap:8,overflowX:"auto",padding:"8px 16px",scrollbarWidth:"none", flexShrink:0}}>
        {quickQ.map((q,i)=>(
          <button key={i} onClick={()=>send(q)} style={{flexShrink:0,padding:"7px 12px",border:"1px solid var(--border)",borderRadius:"999px",background:"var(--surface)",fontSize:12,fontWeight:700,color:"var(--text)",cursor:"pointer",fontFamily:"var(--font)"}}>
            {q}
          </button>
        ))}
      </div>

      <div className="chat-bar" style={{padding:"10px 16px"}}>
        <input className="chat-input" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()} placeholder="Питання..." />
        <button className="send-btn" onClick={()=>send()} disabled={!input.trim()||loading}><IC n="send" sz={18} c="#fff"/></button>
      </div>
    </div>
  );
}

function OrderScreen({onNav}) {
  const [form,setForm]=useState({name:"",telegram:"",business:""});
  const [plan,setPlan]=useState("pro");
  const [sending,setSending]=useState(false); 
  const [done,setDone]=useState(false);

  const submit = async () => {
    setSending(true);
    
    const tg = window.Telegram?.WebApp;
    const u = tg?.initDataUnsafe?.user;
    
    let tgProfile = "Браузер (не в Telegram)";
    if (u) {
      if (u.username) {
        tgProfile = `@${u.username}`;
      } else {
        tgProfile = `<a href="tg://user?id=${u.id}">${escapeHTML(u.first_name)}</a>`;
      }
    }

    const planName = PLANS.find(p => p.id === plan)?.name || "Pro";
    
    const msg = `🚀 <b>НОВА ЗАЯВКА НА ДОДАТОК</b>\n\n` +
                `👤 <b>Ім'я:</b> ${escapeHTML(form.name)}\n` +
                `📞 <b>Введений контакт:</b> ${escapeHTML(form.telegram)}\n` +
                `💼 <b>Бізнес:</b> ${escapeHTML(form.business)}\n` +
                `📦 <b>Тариф:</b> ${planName}\n` +
                `📱 <b>Телеграм юзер:</b> ${tgProfile}`;

    await sendTelegramMessage(msg); 
    setSending(false);
    setDone(true);
  };

  if (done) return (
    <div className="success-wrap-min fade-in">
      <div style={{width: 72, height: 72, borderRadius: '24px', border: '1.5px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 24, boxShadow: 'var(--sh)'}}>
        <IC n="check" sz={36} c="var(--text)"/>
      </div>
      <div className="success-title-min">Дякуємо!</div>
      <div className="success-sub-min"> Ми отримали вашу заявку і скоро зв'яжемось з вами.</div>
      <button className="btn btn-primary" style={{width: '100%'}} onClick={()=>onNav("home")}>На головну</button>
    </div>
  );

  return (
    <div className="fade-in">
      <Header onBack={()=>onNav("home")} title="Замовити" />
      <div style={{marginBottom: 20}}>
        {PLANS.map(p=>(
          <div key={p.id} className={`plan-card ${plan===p.id?"selected":""}`} onClick={()=>setPlan(p.id)}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
              {p.hot && <span style={{border:'1px solid var(--text)',color:'var(--text)',fontSize:10,fontWeight:800,padding:"3px 8px",borderRadius:"999px"}}>ПОПУЛЯРНЕ</span>}
              <div style={{fontSize:17,fontWeight:800,color:'var(--text)',flex:1}}>{p.name}</div>
              <div className="plan-check">{plan===p.id && <IC n="check" sz={12} c="#fff"/>}</div>
            </div>
            <div style={{fontSize:22,fontWeight:800,color:'var(--text)',marginBottom:6}}>{p.price}</div>
            <div style={{fontSize:13,color:'var(--text-2)',fontWeight:500,marginBottom:12}}>{p.desc}</div>
            {p.features.map((f,i)=>(
              <div key={i} style={{fontSize:13,fontWeight:500,color:'var(--text-2)',display:"flex",gap:6,alignItems:"center",paddingTop:4}}>
                <IC n="check" sz={14} c="var(--text)"/>{f}
              </div>
            ))}
          </div>
        ))}
      </div>
      <label className="field-label">Ваше ім'я</label><input className="field" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Ім'я"/>
      <label className="field-label">Telegram</label><input className="field" value={form.telegram} onChange={e=>setForm({...form,telegram:e.target.value})} placeholder="@username"/>
      <label className="field-label">Ваша ніша</label><input className="field" value={form.business} onChange={e=>setForm({...form,business:e.target.value})} placeholder="Бізнес"/>
      <button className="btn btn-accent mt" style={{marginTop: 20}} disabled={!form.name||!form.telegram||sending} onClick={submit}>{sending?"Відправка...":"Замовити"}</button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
