<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <title>PsychApp — Психолог Олена Коваленко</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
  /* ════════════════════════════════════════════════════
     DESIGN SYSTEM — Inspired by Premium Modern App Reference
     Font: Plus Jakarta Sans
     Theme: Light, High Contrast, Pastel Accents
  ═══════════════════════════════════════════════════════ */
  *, *::before, *::after {
    box-sizing: border-box; margin: 0; padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    /* Base Colors */
    --bg:        #F8F9FA; /* Very light neutral background */
    --surface:   #FFFFFF;
    --surface-alt:#F3F4F6;
    
    /* Text Colors */
    --text-main: #111827; /* Dark almost black for high contrast */
    --text-mut:  #6B7280; /* Muted gray for secondary text */
    --text-inv:  #FFFFFF; /* White text on dark buttons */

    /* Primary / Actions */
    --primary:   #111827; /* Black primary action */
    --primary-h: #374151;
    --border:    #E5E7EB;

    /* Pastel Accents */
    --pastel-green:  #DCFCE7;
    --pastel-green-t:#166534;
    --pastel-purple: #F3E8FF;
    --pastel-purple-t:#6B21A8;
    --pastel-blue:   #E0F2FE;
    --pastel-blue-t: #075985;
    --pastel-orange: #FFEDD5;
    --pastel-orange-t:#9A3412;

    /* Semantic */
    --error:     #EF4444;
    --success:   #10B981;
    --warning:   #F59E0B;

    /* Radius */
    --r-card:    24px;
    --r-card-sm: 16px;
    --r-btn:     999px;
    --r-icon:    12px;

    /* Shadows */
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.06);

    --font: 'Plus Jakarta Sans', -apple-system, sans-serif;
  }

  html, body, #root {
    height: 100%;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text-main);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden; 
  }

  .app {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,.05);
    overflow-x: hidden;
  }

  .screen {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 24px 100px;
    -webkit-overflow-scrolling: touch;
  }

  /* ── TOPBAR ── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 0 20px;
  }
  .tb-greeting {
    font-size: 24px; font-weight: 800; letter-spacing: -0.03em; color: var(--text-main); line-height: 1.1;
  }
  .tb-sub {
    font-size: 13px; font-weight: 500; color: var(--text-mut); margin-top: 4px;
  }
  .tb-icon-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: var(--shadow-sm); color: var(--text-main);
  }

  /* ── HERO BANNER ── */
  .hero-banner {
    background: var(--pastel-blue);
    border-radius: var(--r-card);
    padding: 24px;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 32px;
    position: relative; overflow: hidden;
    cursor: pointer;
  }
  .hero-content {
    flex: 1; position: relative; z-index: 2;
  }
  .hero-title {
    font-size: 18px; font-weight: 800; color: var(--pastel-blue-t); letter-spacing: -0.02em; margin-bottom: 6px;
  }
  .hero-desc {
    font-size: 12px; color: var(--pastel-blue-t); font-weight: 500; opacity: 0.8; margin-bottom: 16px; line-height: 1.4;
  }
  .hero-btn {
    background: var(--primary); color: var(--text-inv);
    border-radius: var(--r-btn); padding: 8px 20px;
    font-size: 12px; font-weight: 700; border: none; cursor: pointer;
    font-family: var(--font);
  }
  .hero-avatar {
    width: 90px; height: 90px; border-radius: 50%;
    object-fit: cover; border: 4px solid var(--surface);
    position: relative; z-index: 2;
  }
  .hero-blob {
    position: absolute; right: -20px; top: -20px;
    width: 150px; height: 150px; background: rgba(255,255,255,0.4);
    border-radius: 50%; filter: blur(20px); z-index: 1;
  }

  /* ── SECTION HEADERS ── */
  .sec-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .sec-title {
    font-size: 18px; font-weight: 800; color: var(--text-main); letter-spacing: -0.02em;
  }

  /* ── SYMMETRICAL TABS ── */
  .tabs-grid {
    display: flex; background: var(--surface-alt);
    padding: 4px; border-radius: 16px; margin-bottom: 24px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
  }
  .tab-btn {
    flex: 1; padding: 10px 0; border-radius: 12px;
    font-size: 13px; font-weight: 700; font-family: var(--font);
    text-align: center; cursor: pointer; border: none;
    background: transparent; color: var(--text-mut);
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: var(--surface); color: var(--text-main);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  /* ── PASTEL GRID CARDS ── */
  .grid-2 {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 32px;
  }
  .p-card {
    border-radius: var(--r-card); padding: 20px; cursor: pointer;
    display: flex; flex-direction: column; transition: transform 0.1s;
  }
  .p-card:active { transform: scale(0.97); }
  .p-card-icon {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px; background: rgba(255,255,255,0.5);
  }
  .p-card-title {
    font-size: 16px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px;
  }
  .p-card-sub {
    font-size: 12px; font-weight: 600; opacity: 0.7; display: flex; align-items: flex-start; gap: 6px; line-height: 1.4;
  }

  /* ── LIST CARDS ── */
  .list-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-card-sm); padding: 16px; margin-bottom: 12px;
    display: flex; align-items: center; gap: 16px; cursor: pointer;
    box-shadow: var(--shadow-sm); transition: transform 0.1s;
  }
  .list-card:active { transform: scale(0.98); }
  .lc-icon {
    width: 48px; height: 48px; border-radius: var(--r-icon);
    background: var(--surface-alt); display: flex; align-items: center; justify-content: center;
    color: var(--text-main); flex-shrink: 0;
  }
  .lc-body { flex: 1; min-width: 0; }
  .lc-title { font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lc-sub { font-size: 12px; font-weight: 500; color: var(--text-mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lc-arrow { color: #D1D5DB; }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px; height: 80px;
    background: var(--surface);
    display: flex; align-items: center; justify-content: space-around;
    padding-bottom: env(safe-area-inset-bottom);
    border-top: 1px solid var(--border); z-index: 100;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: #9CA3AF; cursor: pointer; background: none; border: none;
    padding: 10px; transition: color 0.2s; font-family: var(--font);
  }
  .nav-item.active { color: var(--primary); }
  .nav-label { font-size: 10px; font-weight: 700; }

  /* ── BUTTONS ── */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 18px; border: none; border-radius: var(--r-btn);
    font-family: var(--font); font-size: 15px; font-weight: 700;
    cursor: pointer; transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; pointer-events: none; }
  .btn-primary { background: var(--primary); color: var(--text-inv); }
  .btn-secondary { background: var(--surface); color: var(--text-main); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
  .mt-4 { margin-top: 16px; }
  .mt-2 { margin-top: 8px; }

  /* ── GENERIC CARDS & INPUTS ── */
  .content-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-card); padding: 24px; margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
  }
  .input-label {
    display: block; font-size: 12px; font-weight: 700; color: var(--text-main);
    margin-bottom: 8px; margin-top: 16px;
  }
  .input-field {
    width: 100%; padding: 16px; border: 1px solid var(--border);
    border-radius: 16px; font-family: var(--font); font-size: 15px;
    background: var(--surface-alt); color: var(--text-main); outline: none;
    transition: border 0.2s, background 0.2s;
  }
  .input-field:focus { border-color: var(--primary); background: var(--surface); }
  textarea.input-field { resize: none; }

  /* ── TEST OPTIONS ── */
  .test-opt {
    width: 100%; padding: 16px 20px; border: 1px solid var(--border);
    border-radius: 16px; font-family: var(--font); font-size: 15px; font-weight: 600;
    background: var(--surface); color: var(--text-main); text-align: left;
    margin-bottom: 10px; display: flex; align-items: center; gap: 16px;
    transition: all 0.2s; box-shadow: var(--shadow-sm); cursor: pointer;
  }
  .test-opt:active { background: var(--surface-alt); border-color: var(--text-mut); }
  .opt-letter {
    width: 32px; height: 32px; border-radius: 50%; background: var(--surface-alt);
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: var(--text-mut); flex-shrink: 0;
  }

  /* ── CALENDAR ── */
  .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .cal-nav-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-day-name { text-align: center; font-size: 11px; font-weight: 700; color: var(--text-mut); padding-bottom: 12px; }
  .cal-cell {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; font-family: var(--font);
    border-radius: 50%; border: none; background: transparent; color: var(--text-main); cursor: pointer;
  }
  .cal-cell.past { color: #D1D5DB; cursor: default; }
  .cal-cell.avail { background: var(--surface-alt); }
  .cal-cell.sel { background: var(--primary); color: var(--text-inv); font-weight: 800; }
  
  .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 24px; }
  .time-slot {
    padding: 14px 0; text-align: center; border: 1px solid var(--border);
    border-radius: 16px; font-size: 14px; font-weight: 700; color: var(--text-main);
    background: var(--surface); cursor: pointer; font-family: var(--font);
  }
  .time-slot.sel { background: var(--primary); color: var(--text-inv); border-color: var(--primary); }

  /* ── PROGRESS ── */
  .prog-bar { height: 6px; background: var(--surface-alt); border-radius: 999px; overflow: hidden; margin-bottom: 24px; }
  .prog-fill { height: 100%; background: var(--primary); border-radius: 999px; transition: width 0.3s ease; }

  /* ── CHAT ── */
  .chat-container { display: flex; flex-direction: column; height: calc(100vh - 80px); padding-top: 16px; }
  .chat-scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding-bottom: 20px; }
  .chat-bubble { max-width: 85%; padding: 14px 18px; border-radius: 20px; font-size: 15px; line-height: 1.5; font-weight: 500; }
  .cb-bot { background: var(--surface); color: var(--text-main); border-bottom-left-radius: 4px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
  .cb-user { background: var(--primary); color: var(--text-inv); border-bottom-right-radius: 4px; align-self: flex-end; }
  .chat-input-area { padding: 12px 0; display: flex; gap: 10px; }
  .chat-input { flex: 1; border: 1px solid var(--border); border-radius: 999px; padding: 0 20px; font-family: var(--font); font-size: 15px; background: var(--surface); outline: none; }
  .chat-send { width: 48px; height: 48px; border-radius: 50%; background: var(--primary); color: #fff; border: none; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; }

  /* ── MISC ── */
  .back-row { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
  .back-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-main); }
  .page-title { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
  .divider { height: 1px; background: var(--border); margin: 20px 0; }
  .text-pre { white-space: pre-line; line-height: 1.6; font-size: 14px; color: var(--text-mut); font-weight: 500; }
  
  .badge-green { background: var(--pastel-green); color: var(--pastel-green-t); padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .badge-blue { background: var(--pastel-blue); color: var(--pastel-blue-t); padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  .typing-dot { width: 6px; height: 6px; background: var(--text-mut); border-radius: 50%; display: inline-block; margin: 0 2px; animation: pulse 1.5s infinite; }
  .typing-dot:nth-child(2){animation-delay:.2s} .typing-dot:nth-child(3){animation-delay:.4s}
  </style>
</head>

// ── Глобальна функція для надсилання повідомлень в Telegram ────────────
window.sendNotify = async function(text) {
  try {
    const res = await fetch(`${PROXY_URL}/notify`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({chat_id: CHAT_ID, text})
    });
    return res.ok;
  } catch(e) { 
    console.error('notify error', e); 
    return false; 
  }
};

// ── LocalStorage Helpers ───────────────────────────────────────────────
function getSavedChats() {
  try { return JSON.parse(localStorage.getItem('psych_chats')) || []; } catch(e) { return []; }
}
function saveChats(chats) {
  localStorage.setItem('psych_chats', JSON.stringify(chats));
}
function getSavedBookings() {
  try { return JSON.parse(localStorage.getItem('psych_bookings')) || []; } catch(e) { return []; }
}
function saveBookings(bookings) {
  localStorage.setItem('psych_bookings', JSON.stringify(bookings));
}

function getResult(score, total) {
  const pct = score / (total * 3) * 100;
  if(pct < 25) return {level:"Стабільний стан", color:"var(--success)", text:"Ваш стан загалом добрий. Профілактична робота з психологом допоможе глибше пізнати себе і розкрити потенціал."};
  if(pct < 50) return {level:"Є зони для уваги", color:"var(--warning)", text:"Є кілька зон що потребують уваги. Хороший момент для початку роботи — поки ситуація не поглибилась."};
  if(pct < 75) return {level:"Потрібна підтримка", color:"var(--pastel-orange-t)", text:"Значне навантаження. Підтримка психолога може суттєво змінити якість вашого повсякденного життя."};
  return {level:"Рекомендую звернутись", color:"var(--error)", text:"Зараз вам справді важко. Будь ласка не відкладайте — зверніться до фахівця."};
}

function getDailyTest() {
  const dow = new Date().getDay();
  const idx = dow === 0 ? 6 : dow - 1;
  return DAILY_TESTS[Math.min(idx, DAILY_TESTS.length - 1)];
}

// ── CALENDAR ──────────────────────────────────────────────────────────
function CalendarPicker({onSelect}) {
  const today=new Date();
  const [month,setMonth]=useState(today.getMonth());
  const [year,setYear]=useState(today.getFullYear());
  const [selDate,setSelDate]=useState(null);
  const [selTime,setSelTime]=useState(null);
  const MONTHS=["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
  const DAYS=["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];
  const daysInMonth=new Date(year,month+1,0).getDate();
  let firstDay=new Date(year,month,1).getDay();firstDay=firstDay===0?6:firstDay-1;
  const fmt=(d)=>`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const isPast=(d)=>new Date(year,month,d)<new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const hasSlots=(d)=>{const dow=new Date(year,month,d).getDay()||7;return(SCHEDULE[dow]||[]).some(t=>!BOOKED.includes(`${fmt(d)} ${t}`));};
  const getSlots=(d)=>{const dow=new Date(year,month,d).getDay()||7;return(SCHEDULE[dow]||[]).filter(t=>!BOOKED.includes(`${fmt(d)} ${t}`));};
  const cells=[];for(let i=0;i<firstDay;i++)cells.push(null);for(let d=1;d<=daysInMonth;d++)cells.push(d);
  const prevM=()=>{month===0?(setMonth(11),setYear(y=>y-1)):setMonth(m=>m-1);setSelDate(null);setSelTime(null);};
  const nextM=()=>{month===11?(setMonth(0),setYear(y=>y+1)):setMonth(m=>m+1);setSelDate(null);setSelTime(null);};
  return(
    <div>
      <div className="cal-header">
        <button className="cal-nav-btn" onClick={prevM}><Icon name="back" size={20}/></button>
        <div style={{fontSize:16,fontWeight:800}}>{MONTHS[month]} {year}</div>
        <button className="cal-nav-btn" onClick={nextM} style={{transform:"rotate(180deg)"}}><Icon name="back" size={20}/></button>
      </div>
      <div className="cal-grid" style={{marginBottom:8}}>
        {DAYS.map(d=><div key={d} className="cal-day-name">{d}</div>)}
      </div>
      <div className="cal-grid">
        {cells.map((d,i)=>{
          if(!d)return<div key={i}/>;
          const past=isPast(d),slots=hasSlots(d),selected=selDate===d;
          return(
            <button key={i} className={`cal-cell ${selected?"sel":past?"past":slots?"avail":""}`} onClick={()=>{if(!past&&slots){setSelDate(d);setSelTime(null);}}}>
              {d}
            </button>
          );
        })}
      </div>
      {selDate&&(
        <div>
          <div className="time-grid">
            {getSlots(selDate).map(t=>(
              <button key={t} className={`time-slot ${selTime===t?"sel":""}`} onClick={()=>setSelTime(t)}>
                {t}
              </button>
            ))}
          </div>
          {selTime&&(
            <button className="btn btn-primary mt-4" onClick={()=>onSelect(`${String(selDate).padStart(2,"0")}.${String(month+1).padStart(2,"0")}.${year}`,selTime)}>
              Продовжити
            </button>
          )}
        </div>
      )}
    </div>
  );
}

    if (typeof window.sendNotify === "function") {
      await window.sendNotify(text);
    }
    
    // Збереження бронювання у пам'ять
    const newBooking = {
      id: Date.now(),
      date: data.date,
      time: data.time,
      format: data.format,
      name: data.name,
      request: data.request,
      status: 'upcoming'
    };
    const existing = getSavedBookings();
    saveBookings([...existing, newBooking]);

    setSending(false);
    setStep(3);
  };

    <div style={{paddingTop:40}}>

  return(
    <div style={{paddingTop:20}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:24}}>
        <BackBtn onClick={()=>step===0?onNav("home"):setStep(step-1)} label={step===0?"Запис":"Деталі"}/>
      </div>

      <div className="prog-bar" style={{marginBottom:32}}>
        <div className="prog-fill" style={{width:`${(step===0?25:step===1?50:75)}%`}}></div>
      </div>

      {step===0&&(
        <>
          <div className="page-title" style={{marginBottom:20}}>Оберіть формат</div>
          <div className="grid-2">
            <div className="p-card" style={{background:"var(--pastel-blue)", minHeight:160}} onClick={()=>{setData({...data,format:`Онлайн`});setStep(1);}}>
              <div className="p-card-icon" style={{color:"var(--pastel-blue-t)"}}><Icon name="video" size={20}/></div>
              <div className="p-card-title" style={{color:"var(--pastel-blue-t)", marginTop:"auto"}}>Онлайн</div>
              <div className="p-card-sub" style={{color:"var(--pastel-blue-t)"}}>Zoom / Google Meet</div>
            </div>
            <div className="p-card" style={{background:"var(--pastel-purple)", minHeight:160}} onClick={()=>{setData({...data,format:`Офлайн`});setStep(1);}}>
              <div className="p-card-icon" style={{color:"var(--pastel-purple-t)"}}><Icon name="briefcase" size={20}/></div>
              <div className="p-card-title" style={{color:"var(--pastel-purple-t)", marginTop:"auto"}}>Офлайн</div>
              <div className="p-card-sub" style={{color:"var(--pastel-purple-t)"}}>Київ, кабінет</div>
            </div>
          </div>
        </>
      )}

      {step===1&&(
        <>
          <div className="page-title" style={{marginBottom:20}}>Оберіть час</div>
          <div className="content-card" style={{padding:20}}>
            <CalendarPicker onSelect={(date,time)=>{setData({...data,date,time});setStep(2);}}/>
          </div>
        </>
      )}

      {step===2&&(
        <>
          <div className="list-card" style={{marginBottom:24}}>
            <div className="lc-icon" style={{background:"var(--pastel-green)", color:"var(--pastel-green-t)"}}><Icon name="calendar" size={24}/></div>
            <div className="lc-body">
              <div className="lc-title">{data.date} о {data.time}</div>
              <div className="lc-sub">{data.format} · 50 хвилин</div>
            </div>
          </div>
          <div style={{marginBottom:32}}>
            <span className="input-label">Як до вас звертатися?</span>
            <input className="input-field" autoFocus value={data.name} onChange={e=>setData({...data,name:e.target.value})} placeholder="Наприклад: Олексій"/>
            
            <span className="input-label">Контакт для зв'язку</span>
            <input className="input-field" value={data.contact} onChange={e=>setData({...data,contact:e.target.value})} placeholder="@username або телефон"/>
            
            <span className="input-label">Коротко про ваш запит (необов'язково)</span>
            <textarea className="input-field" value={data.request} onChange={e=>setData({...data,request:e.target.value})} placeholder="З чим би ви хотіли попрацювати?" rows={4}></textarea>
          </div>
          
          <button className="btn btn-primary" disabled={!data.name.trim()||!data.contact.trim()||sending} onClick={confirm}>
            {sending?"Відправка...":"Підтвердити запис"}
          </button>
        </>
      )}
    </div>
  );
}

// ── AI CHAT ───────────────────────────────────────────────────────────
let _globalChats = [];

function AIScreen({onNav}) {
  const [chats,setChats]=useState(()=>getSavedChats());
  const [activeId,setActiveId]=useState(null);
  const [view,setView]=useState("list");

  const createChat = () => {
    const id = Date.now().toString();
    const newChat = {
      id, title:"Новий чат",
      created: new Date().toLocaleDateString("uk-UA"),
      messages:[{role:"bot",text:"Привіт! Я AI-асистент психолога Олени.\n\nМожу вислухати, підтримати та допомогти розібратись у своєму стані. Про що хочеш поговорити?"}],
      history:[],
    };
    const updated = [newChat, ...chats];
    _globalChats = updated;
    setChats(updated);
    saveChats(updated);
    setActiveId(id);
    setView("chat");
  };

  const updateChat = (id, messages, history, title) => {
    const updated = chats.map(c => c.id===id ? {...c, messages, history, title:title||c.title} : c);
    _globalChats = updated;
    setChats(updated);
    saveChats(updated);
  };

  const deleteChat = (id) => {
    const updated = chats.filter(c=>c.id!==id);
    _globalChats = updated;
    setChats(updated);
    saveChats(updated);
    if(activeId===id) { setActiveId(null); setView("list"); }
  };

  if(view==="chat" && activeId) {
    const chat = chats.find(c=>c.id===activeId);
    if(!chat) { setView("list"); return null; }
    return <ChatView chat={chat} onBack={()=>setView("list")} onUpdate={updateChat} onDelete={deleteChat}/>;
  }

  return(
    <div style={{paddingTop:20}}>
      <BackBtn onClick={()=>onNav("home")}/>
      <div className="sec-head" style={{marginBottom:24}}>
        <div className="page-title">AI Помічник</div>
        <button onClick={createChat} style={{background:"none", border:"none", color:"var(--primary)", fontWeight:700, fontSize:14, cursor:"pointer", fontFamily:"var(--font)"}}>+ Новий чат</button>
      </div>

      {chats.length===0?(
        <div className="content-card" style={{textAlign:"center", padding:"40px 20px"}}>
          <div style={{width:80,height:80,borderRadius:"24px",background:"var(--pastel-blue)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 20px"}}><Icon name="bot" size={40} color="var(--pastel-blue-t)"/></div>
          <div style={{fontSize:18,fontWeight:800,marginBottom:8}}>Немає активних чатів</div>
          <div style={{fontSize:14,color:"var(--text-mut)",marginBottom:24,lineHeight:1.5}}>Почніть розмову з AI-асистентом для підтримки 24/7</div>
          <button className="btn btn-primary" onClick={createChat}>Почати спілкування</button>
        </div>
      ):(
        <div>
          {chats.map(c=>(
            <div key={c.id} className="list-card" onClick={()=>{setActiveId(c.id);setView("chat");}}>
              <div className="lc-icon" style={{background:"var(--pastel-purple)", color:"var(--pastel-purple-t)"}}><Icon name="bot" size={24}/></div>
              <div className="lc-body">
                <div className="lc-title">{c.title}</div>
                <div className="lc-sub" style={{whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis", maxWidth:"200px"}}>{c.messages[c.messages.length-1]?.text||""}</div>
              </div>
              <button onClick={e=>{e.stopPropagation();deleteChat(c.id);}} style={{background:"none",border:"none",cursor:"pointer",padding:8,color:"var(--text-mut)"}}><Icon name="trash" size={20}/></button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ChatView({chat, onBack, onUpdate, onDelete}) {
  const [msgs,setMsgs]=useState(chat.messages);
  const [history,setHistory]=useState(chat.history);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const endRef=useRef(null);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:"smooth"});},[msgs,loading]);

  const send = async () => {
    if(!input.trim()||loading)return;
    const txt=input.trim(); setInput(""); setError("");
    const newMsgs=[...msgs,{role:"user",text:txt}];
    const newHist=[...history,{role:"user",content:txt}];
    setMsgs(newMsgs); setHistory(newHist);
    setLoading(true);
    try {
      const res=await fetch(`${PROXY_URL}/chat`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:newHist.slice(-10)})});
      if(!res.ok)throw new Error(`HTTP ${res.status}`);
      const data=await res.json();
      const finalMsgs=[...newMsgs,{role:"bot",text:data.reply}];
      const finalHist=[...newHist,{role:"assistant",content:data.reply}];
      setMsgs(finalMsgs); setHistory(finalHist);
      const title = chat.title==="Новий чат" ? txt.slice(0,30)+(txt.length>30?"...":"") : chat.title;
      onUpdate(chat.id, finalMsgs, finalHist, title);
    } catch(e) {
      setError("Помилка з'єднання. Спробуй ще раз.");
      setMsgs(newMsgs.slice(0,-1)); setHistory(newHist.slice(0,-1));
    }
    setLoading(false);
  };

  return(
    <div className="chat-container">
      <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:8,paddingBottom:16,borderBottom:"1px solid var(--border)"}}>
        <div onClick={onBack} style={{cursor:"pointer", color:"var(--text-main)"}}><Icon name="back" size={24}/></div>
        <div style={{display:"flex",alignItems:"center",gap:12,flex:1}}>
          <div style={{width:40,height:40,borderRadius:12,background:"var(--pastel-blue)",display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="bot" size={20} color="var(--pastel-blue-t)"/></div>
          <div><div style={{fontSize:15,fontWeight:800,color:"var(--text-main)"}}>AI Асистент</div><div style={{fontSize:12,color:"var(--success)",fontWeight:600}}>● Онлайн</div></div>
        </div>
      </div>
      <div className="chat-scroll">
        {msgs.map((m,i)=>(
          <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start"}}>
            <div className={`chat-bubble ${m.role==="bot"?"cb-bot":"cb-user"}`} style={{whiteSpace:"pre-line"}}>{m.text}</div>
          </div>
        ))}
        {loading&&<div style={{display:"flex",justifyContent:"flex-start"}}><div className="chat-bubble cb-bot"><span className="typing-dot"/><span className="typing-dot"/><span className="typing-dot"/></div></div>}
        {error&&<div style={{fontSize:13,color:"var(--error)",textAlign:"center",padding:"8px 0"}}>{error}</div>}
        <div ref={endRef}/>
      </div>
      <div className="chat-input-area">
        <input className="chat-input" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()} placeholder="Повідомлення..."/>
        <button className="chat-send" onClick={send} disabled={!input.trim()||loading}><Icon name="send" size={20}/></button>
      </div>
    </div>
  );
}
